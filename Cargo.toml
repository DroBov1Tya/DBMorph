[package]
name = "DBMorph"
version = "0.0.3"
edition = "2021"

[dependencies]
chardetng = "0.1.17"
clap = { version = "4.5.38", features = ["derive"] }
colored = "3.0.0"
csv = "1.3.1"
encoding_rs = "0.8.35"
encoding_rs_io = "0.1.7"
futures = "0.3.31"
obfstr = "0.4.4"
serde_json = "1.0.140"
sqlparser = "0.56.0"
sqlx = { version = "0.8.5", features = ["sqlite", "runtime-tokio-native-tls", "mysql", "postgres"] }
tabled = "0.19.0"
tokio = { version = "1.45.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
